name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  container:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build NewsLens image
        run: docker build --tag newslens-api:ci .

      - name: Start artifact-free container
        run: |
          docker run \
            --detach \
            --name newslens-api-ci \
            --publish 8000:8000 \
            newslens-api:ci

      - name: Verify liveness
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health \
              > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi

            sleep 1
          done

          docker logs newslens-api-ci
          exit 1

      - name: Verify artifact-free readiness contract
        run: |
          status_code="$(
            curl \
              --silent \
              --output /tmp/readiness.json \
              --write-out "%{http_code}" \
              http://127.0.0.1:8000/ready
          )"

          cat /tmp/readiness.json
          test "$status_code" = "503"

      - name: Show container logs
        if: always()
        run: docker logs newslens-api-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force newslens-api-ci || true