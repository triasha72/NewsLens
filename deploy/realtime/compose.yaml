name: newslens-realtime

x-consumer: &consumer
  build:
    context: ../..
    dockerfile: services/ingestion/Dockerfile
  environment: &consumer-environment
    NEWSLENS_INGESTION_MODE: consumer
    NEWSLENS_KAFKA_BROKERS: kafka:9092
    NEWSLENS_KAFKA_TOPIC: news-events
    NEWSLENS_KAFKA_DLQ_TOPIC: news-events-dlq
    NEWSLENS_KAFKA_GROUP_ID: newslens-indexers
    NEWSLENS_DATABASE_URL: postgresql://newslens:newslens@postgres:5432/newslens
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  restart: unless-stopped
  init: true

services:
  postgres:
    build:
      context: ../..
      dockerfile: deploy/realtime/postgres/Dockerfile
    environment:
      POSTGRES_DB: newslens
      POSTGRES_USER: newslens
      POSTGRES_PASSWORD: newslens
    volumes:
      - realtime-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newslens -d newslens"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic news-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic news-events-dlq --partitions 1 --replication-factor 1

  ingestion-api:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    environment:
      NEWSLENS_INGESTION_MODE: api
      NEWSLENS_KAFKA_BROKERS: kafka:9092
      NEWSLENS_KAFKA_TOPIC: news-events
    ports:
      - "8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

  consumer-1:
    <<: *consumer
    environment:
      <<: *consumer-environment
      NEWSLENS_KAFKA_CLIENT_ID: newslens-consumer-1
    ports:
      - "8081:8080"

  consumer-2:
    <<: *consumer
    environment:
      <<: *consumer-environment
      NEWSLENS_KAFKA_CLIENT_ID: newslens-consumer-2
    ports:
      - "8082:8080"

  search-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NEWSLENS_REALTIME_DATABASE_URL: postgresql://newslens:newslens@postgres:5432/newslens
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true

  prometheus:
    build:
      context: ../..
      dockerfile: deploy/realtime/prometheus.Dockerfile
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    depends_on:
      - ingestion-api
      - consumer-1
      - consumer-2

volumes:
  realtime-postgres:
