name: newslens-ec2-app

services:
  consumer-2:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    environment:
      NEWSLENS_INGESTION_MODE: consumer
      NEWSLENS_KAFKA_BROKERS: ${NEWSLENS_STATE_PRIVATE_IP:?set NEWSLENS_STATE_PRIVATE_IP}:19092
      NEWSLENS_KAFKA_TOPIC: news-events
      NEWSLENS_KAFKA_DLQ_TOPIC: news-events-dlq
      NEWSLENS_KAFKA_GROUP_ID: newslens-indexers
      NEWSLENS_KAFKA_CLIENT_ID: newslens-consumer-2
      NEWSLENS_DATABASE_URL: postgresql://newslens:${NEWSLENS_POSTGRES_PASSWORD_URLENCODED:?set NEWSLENS_POSTGRES_PASSWORD_URLENCODED}@${NEWSLENS_STATE_PRIVATE_IP}:5432/newslens
    ports:
      - "8082:8080"
    restart: unless-stopped
    init: true
