[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newslens"
version = "0.3.0"
description = "A leakage-aware news search and recommendation system."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Triasha Sarkar" }]
dependencies = [
  "duckdb>=1.1,<2.0",
  "fastapi>=0.115,<0.120",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "uvicorn>=0.30,<1.0",
  "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
recsys = [
  "torch>=2.4,<2.13",
]
dev = [
  "httpx>=0.27,<1.0",
  "ipykernel>=6.29",
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
newslens = "newslens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"newslens.data" = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
