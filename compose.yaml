services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: newslens-api:phase07
    ports:
      - "8000:8000"
    environment:
      NEWSLENS_SERVING_BUNDLE_PATH: /models/phase07
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    volumes:
      - ./artifacts/serving/phase07_v0_1:/models/phase07:ro
    init: true
